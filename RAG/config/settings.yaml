# Cau hinh application
app:
  name: repo
  version: 1.0.0-beta
  env: production

ingestion:
  max_chunk_tokens: 400
  min_chunk_tokens: 30   # chưa được code sử dụng
  chunk_overlap_lines: 5
  supported_extensions:
    - '.py'
  ignore_dirs:
    - ".git"
    - "node_modules"
    - "__pycache__"
    - ".venv"
    - "venv"
    - "dist"
    - "build"
    - ".idea"
    - ".vscode"
    - "logs"
    - ".pytest_cache"
    - ".mypy_cache"
    - "site-packages"

# Cau hinh chunk khi dung hybrid hoac chunking thong thuong (chua duoc code su dung)
chunking:
  chunk_size: 512
  chunk_overlap: 50

# Cau hinh embedding
embedding:
  model: BAAI/bge-m3
  device: auto
  summary_workers: 4
  max_seq_length: 1024
  batch_size: 32
  backend: torch

# Cau hinh vector database luu tru chunk + embedding
vector_database:
  type: qdrant
  url: http://localhost:6333   # địa chỉ Qdrant server (đổi host/port thì sửa ở đây)
  api_key: null               # nếu dùng Qdrant Cloud
  collection_name: repo
  distance: cosine            # cosine | dot | euclid
  vector_size: 1024           # phải bằng số chiều model embedding (BAAI/bge-m3 = 1024)
  timeout: 30                 # connection timeout in seconds
  sparse_model: Qdrant/bm25
  sparse_disable_stemmer: false   # true = tắt stemmer/stopword tiếng Anh của BM25 (bắt buộc index lại khi đổi)

# Cau hinh model LLM
llm:
  provider: ollama
  model_name: qwen2.5:3b
  base_url: http://localhost:11434
  temperature: 0.2
  max_tokens: 1024
  num_ctx: 8192                # cửa sổ context của Ollama; prompt được tự cắt cho vừa (num_ctx - max_tokens)
  keep_alive: 30m              # giữ model trong bộ nhớ sau lần gọi cuối
  timeout: 180                 # request timeout in seconds (lần gọi đầu phải nạp model nên cần dài)

# Cau hinh RAG
retrieval:
  top_k: 10 # so luong chunk lay ve de dung lam context cho LLM
  score_threshold: 0.0 # chua duoc code su dung (diem RRF cua hybrid khong phai cosine, khong so sanh truc tiep duoc)

# Cau hinh reranking
reranking:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2  # CrossEncoder model for reranking
  device: cpu  # cpu or cuda
  top_k: 5  # Final number of documents after reranking
  candidates: 20  # So chunk lay tu retrieve de rerank, sau do giu top_k chunk tot nhat