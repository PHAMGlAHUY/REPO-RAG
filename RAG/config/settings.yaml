# Cau hinh application
app:
  name: repo
  version: 1.0.0-beta
  env: production

ingestion:
  max_chunk_tokens: 400
  min_chunk_tokens: 30
  max_file_size_mb: 2
  state_file: data/index_state.json
  supported_extensions:
    - '.py'
  ignore_dirs:
    - ".git"
    - "node_modules"
    - "__pycache__"
    - ".venv"
    - "venv"
    - "dist"
    - "build"
    - ".idea"
    - ".vscode"
    - "logs"
    - ".pytest_cache"
    - ".mypy_cache"
    - ".tox"
    - "site-packages"
  ignore_path_parts:
    - "migrations"

# Cau hinh embedding (chạy ONNX bằng onnxruntime, tokenizer lấy từ onnx_dir/tokenizer.json)
embedding:
  model: BAAI/bge-m3
  device: cpu
  onnx_repo: <username>/bge-m3-onnx-int8
  onnx_dir: data/models/bge-m3-onnx
  onnx_file: onnx/model_int8.onnx
  max_seq_length: 512
  batch_size: 32

# Cau hinh vector database luu tru chunk + embedding
vector_database:
  type: qdrant
  url: http://localhost:6333
  api_key: null
  collection_name: repo
  distance: cosine
  timeout: 30
  upsert_batch_size: 64
  hnsw_m: 16
  hnsw_ef_construct: 100
  fingerprint_path: data/index_fingerprint.json
  chunker_version: 2
  sparse_model: Qdrant/bm25
  sparse_disable_stemmer: false

# Cau hinh model LLM
llm:
  provider: ollama
  model_name: qwen2.5:3b
  base_url: http://localhost:11434
  num_ctx: 4096
  max_tokens: 512
  temperature: 0.1
  repeat_penalty: 1.0
  keep_alive: 30m
  timeout: 180

# Cau hinh RAG
retrieval:
  top_k: 6

# Rerank qua Jina API (key lay tu bien moi truong api_key_env)
reranking:
  enabled: true
  model: jina-reranker-v3.5
  url: https://api.jina.ai/v1/rerank
  candidates: 20        # so ung vien lay tu Qdrant truoc khi rerank
  min_score: null       # bo chunk co relevance_score thap hon (null = khong loc)
  max_doc_length: 2048  # token toi da moi document (1-8192)
  timeout: 10
  api_key_env: JINA_API_KEY